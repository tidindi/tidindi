# Tipsstrøm til redaksjonen: nye meldinger fra åpne kilder, sendt på e-post kl. 06 og 12 norsk tid.
# GitHub kjører etter UTC. Vi starter både på vinter- og sommertid, og skriptet slipper bare gjennom kl. 06 og 12 i Oslo.
name: Tipsstrøm

on:
  schedule:
    - cron: '0 4,5,10,11 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Testkjøring (send ikke e-post)'
        type: boolean
        default: true
      vindu:
        description: 'Timer bakover (tomt = standard)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: tipsstrom
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hent og send
        run: node tipsstrom/tipsstrom.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SALO_KUNDER: ${{ secrets.SALO_KUNDER }}
          TIDSSJEKK: ${{ github.event_name == 'schedule' && '1' || '0' }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
          VINDU_TIMER: ${{ inputs.vindu }}
      - name: Lagre e-posten som vedlegg (testkjøring)
        if: always() && hashFiles('tipsstrom.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tipsstrom
          path: tipsstrom.html
          retention-days: 7
